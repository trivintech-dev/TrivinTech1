services:
  - type: web
    name: trivin-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://trivin-tech1.vercel.app,http://localhost:5173
